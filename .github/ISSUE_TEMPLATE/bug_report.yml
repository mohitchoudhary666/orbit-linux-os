name: Bug report
description: Report a reproducible Orbit Linux problem
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands and QEMU options.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host OS and QEMU version
    validations:
      required: true
