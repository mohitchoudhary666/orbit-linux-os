name: Build Orbit Linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential cpio file git make python3 qemu-system-x86 rsync unzip wget
      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: .build/buildroot/dl
          key: buildroot-2026.08-${{ runner.os }}-${{ hashFiles('scripts/configure_buildroot.py') }}
          restore-keys: buildroot-2026.08-${{ runner.os }}-
      - name: Build bootable image
        run: JOBS=2 sh ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-x86_64
          path: |
            dist/orbit-linux-bzImage
            dist/orbit-linux-rootfs.ext2
          if-no-files-found: error
          retention-days: 30
